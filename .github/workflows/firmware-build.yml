name: Firmware build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Prepare non-secret build configuration
        run: python3 scripts/setup_local_config.py
      - name: Verify dashboard and project files
        run: |
          python3 scripts/embed_dashboard.py
          python3 tests/check_project.py
      - name: Compile ESP32-S3 firmware
        run: pio run -e selene_v4
